version: '3.8'

services:
  web:
    build:
      context: ./services/summaries
      ssh:
        - default
    command: gunicorn --bind 0.0.0.0:8000 app.main:app -k uvicorn.workers.UvicornWorker --timeout=120 --access-logfile=- --log-level debug 
    volumes:
      - ./services/summaries:/usr/src/app
    env_file:
      - ./services/summaries/.env
    depends_on:   # new
      - web-db
    ports:
      - 8000:8000
    extra_hosts:
      - "host.docker.internal:host-gateway" 
  web-db:
    build:
      context: ./services/summaries/db
      dockerfile: Dockerfile
    expose:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
