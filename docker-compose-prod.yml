version: '3.8'

services:
  web:
    build:
      context: ./services/summaries
      dockerfile: Dockerfile.prod
    environment:
      - ENVIRONMENT=prod
      - TESTING=0
      - DATABASE_URL=${DATABASE_URL}
  client:
    build:
      context: ./services/client
      dockerfile: Dockerfile.prod
    expose:
      - 3000
    environment:
      - REACT_APP_API_SERVICE_URL=${REACT_APP_API_SERVICE_URL}
    depends_on:
      - web
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
