version: '3.8'

services:
  web:
    build:
      context: ./services/summaries
      dockerfile: Dockerfile.prod
    environment:
      - ENVIRONMENT=prod
      - TESTING=0
      - DATABASE_URL=${DATABASE_URL}
  client:
    build:
      context: ./services/client
      dockerfile: Dockerfile.prod
    expose:
      - 3000
    environment:
      - REACT_APP_API_SERVICE_URL=${REACT_APP_API_SERVICE_URL}
    depends_on:
      - web
  nginx:
    image: nginx:1.15-alpine
    restart: unless-stopped
    volumes:
      - ./services/nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf
      - /home/ubuntu/data/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/data/certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - client 
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - /home/ubuntu/data/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
