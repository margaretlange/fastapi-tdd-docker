name: Continuous Integration and Delivery

on: [push]

env:
  API_IMAGE: ghcr.io/$(echo $GITHUB_REPOSITORY | tr '[A-Z]' '[a-z]')/summarizer

jobs:

  build:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up ssh agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TESTING_API_SSH_PRIVATE }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          ssh: |
            default=${{ env.SSH_AUTH_SOCK }}
          tags: ${{ env.API_IMAGE }}:latest
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ./services/summaries/Dockerfile.prod
          context: ./services/summaries