name: Continuous Integration and Delivery

on: [push]

env:
  IMAGE_API: ghcr.io/$(echo $GITHUB_REPOSITORY | tr '[A-Z]' '[a-z]')/summarizer

jobs:

  build:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Step up ssh agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TESTING_API_SSH_PRIVATE }}
      - name: Log in to GitHub Packages
        run: echo ${GITHUB_TOKEN} | docker login -u ${GITHUB_ACTOR} --password-stdin ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: |
          docker pull ${{ env.IMAGE_API }}:latest || true
      - name: Build image
        run: |
          docker build \
            --cache-from ${{ env.IMAGE_API }}:latest \
            --tag ${{ env.IMAGE_API }}:latest \
            --file ./services/summaries/Dockerfile.prod \
            "./services/summaries"
      - name: Push image
        run: |
          docker push ${{ env.IMAGE_API }}:latest

  test:
    name: Test API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main
      - name: Log in to GitHub Packages
        run: echo ${GITHUB_TOKEN} | docker login -u ${GITHUB_ACTOR} --password-stdin ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: |
          docker pull ${{ env.IMAGE_API }}:latest || true
      - name: Build image
        run: |
          docker build \
            --cache-from ${{ env.IMAGE_API }}:latest \
            --tag ${{ env.IMAGE_API }}:latest \
            --file ./services/summaries/Dockerfile.prod \
            "./services/summaries"
      - name: Run container
        run: |
          docker run \
            -d \
            --name fastapi-tdd \
            -e PORT=8765 \
            -e ENVIRONMENT=dev \
            -e DATABASE_URL=sqlite://sqlite.db \
            -e DATABASE_TEST_URL=sqlite://sqlite.db \
            -e TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -p 5003:8765 \
            ${{ env.IMAGE_API }}:latest
      - name: Pytest
        run: docker exec fastapi-tdd python -m pytest .
      - name: Flake8
        run: docker exec fastapi-tdd python -m flake8 .
      - name: Black
        run: docker exec fastapi-tdd python -m black . --check
      - name: isort
        run: docker exec fastapi-tdd python -m isort . --check-only
