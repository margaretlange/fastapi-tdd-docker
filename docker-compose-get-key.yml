version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default-nginx-before-key.conf
      - /home/ubuntu/certbot/data:/usr/share/nginx/html
      - /home/ubuntu/certbot/conf:/etc/nginx/ssl
  certbot:
    image: certbot/certbot:latest
    command: certonly --webroot --webroot-path=/usr/share/nginx/html --email margaret.meek@gmail.com --agree-tos --no-eff-email -d mmldemo.com 
    volumes:
      - /home/ubuntu/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/certbot/logs:/var/log/letsencrypt
      - /home/ubuntu/certbot/data:/usr/share/nginx/html
